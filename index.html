<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d0d0f" />
  <title>Focus</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="container">
    <header class="top-bar">
      <div class="mode-switch">
        <button id="btn-focus" class="mode-btn active" onclick="setMode('focus')">Fokus</button>
        <button id="btn-break" class="mode-btn" onclick="setMode('break')">Pause</button>
      </div>
      <button id="auth-btn" class="auth-btn" onclick="handleAuth()">Google Kalender verbinden</button>
    </header>

    <section class="timer-section">
      <input 
        type="text" 
        id="topic-input" 
        placeholder="Thema eingeben..." 
        autocomplete="off"
      />
      <div id="timer-display" class="timer">25:00</div>
      
      <div class="controls">
        <button id="start-btn" class="primary-btn" onclick="toggleTimer()">Start</button>
        <button id="reset-btn" class="secondary-btn" onclick="resetTimer()">Reset</button>
      </div>
      <p id="status-msg" class="status-msg"></p>
    </section>
  </main>

  <script>
    // HIER DEINE GOOGLE CLIENT ID EINTRAGEN:
    const CLIENT_ID = "DEINE_CLIENT_ID_HIER.apps.googleusercontent.com";
    const SCOPES = "https://www.googleapis.com/auth/calendar.events";

    let tokenClient;
    let accessToken = localStorage.getItem("gcal_token") || null;

    let mode = "focus"; // 'focus' oder 'break'
    let duration = 25 * 60;
    let timeLeft = duration;
    let timerInterval = null;
    let startTime = null;

    const timerDisplay = document.getElementById("timer-display");
    const startBtn = document.getElementById("start-btn");
    const topicInput = document.getElementById("topic-input");
    const authBtn = document.getElementById("auth-btn");
    const statusMsg = document.getElementById("status-msg");

    // Gespeichertes Thema laden
    topicInput.value = localStorage.getItem("focus_topic") || "";
    topicInput.addEventListener("input", () => {
      localStorage.setItem("focus_topic", topicInput.value);
    });

    // Google OAuth initialisieren
    window.onload = () => {
      if (accessToken) {
        authBtn.textContent = "Kalender aktiv";
        authBtn.classList.add("connected");
      }
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            accessToken = tokenResponse.access_token;
            localStorage.setItem("gcal_token", accessToken);
            authBtn.textContent = "Kalender aktiv";
            authBtn.classList.add("connected");
            showStatus("Google Kalender verbunden.");
          }
        },
      });
    };

    function handleAuth() {
      tokenClient.requestAccessToken({ prompt: "consent" });
    }

    function setMode(newMode) {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      startBtn.textContent = "Start";
      mode = newMode;

      document.getElementById("btn-focus").classList.toggle("active", mode === "focus");
      document.getElementById("btn-break").classList.toggle("active", mode === "break");

      duration = mode === "focus" ? 25 * 60 : 5 * 60;
      timeLeft = duration;
      updateDisplay();
    }

    function toggleTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        startBtn.textContent = "Weiter";
      } else {
        if (!startTime) startTime = new Date();
        startBtn.textContent = "Pause";
        timerInterval = setInterval(() => {
          timeLeft--;
          updateDisplay();
          if (timeLeft <= 0) {
            completeSession();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      startTime = null;
      timeLeft = duration;
      startBtn.textContent = "Start";
      updateDisplay();
    }

    function updateDisplay() {
      const mins = Math.floor(timeLeft / 60).toString().padStart(2, "0");
      const secs = (timeLeft % 60).toString().padStart(2, "0");
      timerDisplay.textContent = `${mins}:${secs}`;
      document.title = `${mins}:${secs} – ${topicInput.value || "Focus"}`;
    }

    async function completeSession() {
      clearInterval(timerInterval);
      timerInterval = null;
      const endTime = new Date();
      playBeep();

      if (mode === "focus" && accessToken) {
        await logToGoogleCalendar(startTime || new Date(endTime - duration * 1000), endTime);
      } else if (mode === "focus") {
        showStatus("Session beendet (Kalender nicht verbunden).");
      }

      startTime = null;
      setMode(mode === "focus" ? "break" : "focus");
    }

    async function logToGoogleCalendar(start, end) {
      const topic = topicInput.value.trim() || "Fokus-Session";
      const event = {
        summary: `🍅 ${topic}`,
        description: "Automatisch erfasste Pomodoro-Session",
        start: { dateTime: start.toISOString() },
        end: { dateTime: end.toISOString() },
      };

      try {
        const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
          method: "POST",
          headers: {
            Authorization: `Bearer ${accessToken}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(event),
        });

        if (res.status === 401) {
          // Token abgelaufen -> neu anfordern
          localStorage.removeItem("gcal_token");
          authBtn.textContent = "Neu verbinden";
          authBtn.classList.remove("connected");
          showStatus("Bitte Kalender kurz neu verbinden.");
          return;
        }

        if (res.ok) {
          showStatus(`Im Kalender gespeichert: ${topic}`);
        }
      } catch (err) {
        showStatus("Fehler beim Kalender-Sync.");
      }
    }

    function showStatus(text) {
      statusMsg.textContent = text;
      setTimeout(() => (statusMsg.textContent = ""), 5000);
    }

    function playBeep() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(528, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    }
  </script>
</body>
</html>
