<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12131A" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Pomodoro-Timer mit Google-Kalender-Anbindung" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Focus" />
  <title>Focus</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body data-mode="focus">
  <div class="fill" id="fill" aria-hidden="true"></div>

  <main class="app">
    <header class="bar">
      <div class="modes" role="group" aria-label="Phase">
        <button class="mode" data-mode="focus" aria-pressed="true">Fokus</button>
        <button class="mode" data-mode="break" aria-pressed="false">Pause</button>
        <button class="mode" data-mode="long" aria-pressed="false">Lange Pause</button>
      </div>
      <button id="settings-btn" class="icon-btn" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </header>

    <section class="stage">
      <label class="sr-only" for="topic">Thema der Session</label>
      <input id="topic" type="text" placeholder="Woran arbeitest du?" autocomplete="off" maxlength="80" />
      <div id="time" class="time" role="timer" aria-label="Verbleibende Zeit">25:00</div>
      <div class="dots" id="dots" role="img" aria-label="0 von 4 Sessions">
        <span></span><span></span><span></span><span></span>
      </div>
      <p id="today" class="today"></p>
    </section>

    <footer class="dock">
      <button id="reset" class="icon-btn round" aria-label="Zurücksetzen">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4h4"/></svg>
      </button>
      <button id="toggle" class="play" aria-label="Start">
        <svg class="i-play" viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>
      </button>
      <button id="skip" class="icon-btn round" aria-label="Phase überspringen">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5.5v13l9-6.5-9-6.5Z"/><path d="M19 5v14"/></svg>
      </button>
    </footer>

    <button id="cal" class="cal"><span class="cal-dot"></span><span id="cal-text">Kalender verbinden</span></button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>Einstellungen</h2>
      <p class="hint">Dauer in Minuten</p>
      <label>Fokus <input id="s-focus" type="number" min="1" max="180" inputmode="numeric" /></label>
      <label>Pause <input id="s-break" type="number" min="1" max="60" inputmode="numeric" /></label>
      <label>Lange Pause <input id="s-long" type="number" min="1" max="90" inputmode="numeric" /></label>
      <p id="install-hint" class="hint" hidden>Zum Installieren: Teilen-Symbol, dann „Zum Home-Bildschirm“.</p>
      <div class="dialog-actions">
        <button type="button" id="install" class="ghost" hidden>App installieren</button>
        <button type="button" id="cancel" class="ghost">Abbrechen</button>
        <button type="submit" class="solid">Speichern</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
